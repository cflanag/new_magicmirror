; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Plain `pio run` / `pio run -t upload` targets only the main firmware.
; Use `pio run -e set_clock -t upload` explicitly for the one-time clock-set utility.
default_envs = seeed_xiao_esp32c3

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<set_clock.cpp> -<i2c_scan.cpp>
lib_deps =
	sparkfun/SparkFun BME280@^2.0.9
	adafruit/RTClib@^2.1.4

; One-time utility: sets the DS3231's clock to this build's compile time.
; Upload with `pio run -e set_clock -t upload`, confirm via serial monitor,
; then switch back to uploading the main [env:seeed_xiao_esp32c3] environment.
[env:set_clock]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_src_filter = +<set_clock.cpp> -<transmitter_bme280.cpp> -<i2c_scan.cpp>
lib_deps =
	adafruit/RTClib@^2.1.4

; Diagnostic utility: scans the I2C bus and prints every responding address.
[env:i2c_scan]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_src_filter = +<i2c_scan.cpp> -<transmitter_bme280.cpp> -<set_clock.cpp>
